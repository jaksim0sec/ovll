<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >
  <meta
    name="robots"
    content="noindex,nofollow"
  >
  <title>ovll log</title>
  <style>
    :root {
      color-scheme: dark;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background:#111210;
      color:#ecece8;
    }

    * {
      box-sizing:border-box;
    }

    body {
      margin:0;
      min-height:100vh;
      background:#111210;
    }

    main {
      width:min(1040px,calc(100% - 28px));
      margin:0 auto;
      padding:34px 0 64px;
    }

    header {
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:20px;
      margin-bottom:24px;
    }

    h1 {
      margin:0;
      font-size:22px;
      letter-spacing:-.04em;
    }

    .sub {
      margin-top:6px;
      color:#888a84;
      font-size:12px;
    }

    .live {
      display:flex;
      align-items:center;
      gap:7px;
      color:#a4a69f;
      font-size:12px;
    }

    .dot {
      width:7px;
      height:7px;
      border-radius:50%;
      background:#77c58b;
      box-shadow:0 0 0 4px rgba(119,197,139,.08);
    }

    #runtime,
    #summary {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    #runtime {
      margin-bottom:8px;
    }

    .pill.warn {
      color:#d8b36f;
      border-color:#4b3b21;
      background:#1c1811;
    }

    .pill {
      padding:7px 10px;
      border:1px solid #292a27;
      border-radius:999px;
      color:#9b9d96;
      background:#171815;
      font-size:11px;
    }

    #logs {
      display:grid;
      gap:8px;
    }

    article {
      padding:15px 16px;
      border:1px solid #292a27;
      border-radius:14px;
      background:#171815;
    }

    .top {
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
    }

    .state {
      width:8px;
      height:8px;
      flex:0 0 auto;
      border-radius:50%;
      background:#77c58b;
    }

    article.fail .state {
      background:#d36d65;
    }

    .kind {
      font-size:12px;
      font-weight:650;
    }

    .nodes {
      min-width:0;
      overflow:hidden;
      color:#8f918a;
      font-size:11px;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    time {
      margin-left:auto;
      flex:0 0 auto;
      color:#6f716b;
      font-size:10px;
    }

    .metrics {
      display:flex;
      flex-wrap:wrap;
      gap:5px 12px;
      margin-top:11px;
      color:#a2a49d;
      font-size:11px;
      font-variant-numeric:tabular-nums;
    }

    .metrics b {
      color:#d7d8d2;
      font-weight:560;
    }

    .preview {
      margin-top:12px;
      padding-top:11px;
      border-top:1px solid #242522;
      color:#777972;
      font:11px/1.55
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;
      overflow-wrap:anywhere;
    }

    .empty {
      padding:80px 12px;
      color:#70726c;
      text-align:center;
      font-size:12px;
    }

    @media (max-width:600px) {
      main {
        width:calc(100% - 20px);
        padding-top:22px;
      }

      header {
        align-items:flex-start;
      }

      time {
        display:none;
      }

      article {
        padding:14px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Gemini log</h1>
        <div class="sub">
          최근 요청 100건 · 서버 재시작 시 초기화
        </div>
      </div>
      <div class="live">
        <span class="dot"></span>
        3초 갱신
      </div>
    </header>

    <div id="runtime"></div>
    <div id="summary"></div>
    <section id="logs"></section>
  </main>

  <script>
    const logsEl =
      document.querySelector("#logs");
    const summaryEl =
      document.querySelector("#summary");
    const runtimeEl =
      document.querySelector("#runtime");

    const esc = value =>
      String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;");

    function metric(label,value){
      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return "";
      }

      return `<span>${esc(label)} <b>${esc(value)}</b></span>`;
    }

    const mb = bytes =>
      Number.isFinite(
        Number(bytes)
      )
        ? (
            Number(bytes) /
            1024 /
            1024
          ).toFixed(1) +
          "MB"
        : "-";

    const uptime = seconds => {
      const value =
        Math.max(
          0,
          Number(seconds) || 0
        );

      if (value < 60) {
        return Math.round(value) + "s";
      }

      if (value < 3600) {
        return Math.floor(value / 60) + "m";
      }

      return (
        Math.floor(value / 3600) +
        "h " +
        Math.floor(
          (value % 3600) / 60
        ) +
        "m"
      );
    };

    function renderRuntime(runtime){
      if (!runtime) {
        runtimeEl.innerHTML = "";
        return;
      }

      runtimeEl.innerHTML = [
        `<span class="pill ${runtime.recentRestart ? "warn" : ""}">uptime ${esc(uptime(runtime.uptimeSec))}</span>`,
        `<span class="pill">RSS ${esc(mb(runtime.rssBytes))}</span>`,
        `<span class="pill">heap ${esc(mb(runtime.heapUsedBytes))} / ${esc(mb(runtime.heapTotalBytes))}</span>`,
        `<span class="pill">event loop ${esc(Math.round(Number(runtime.eventLoopLagMs) || 0))}ms</span>`,
        `<span class="pill">boot ${esc(String(runtime.bootId || "").slice(0,8))}</span>`
      ].join("");
    }

    function render(logs){
      const ok =
        logs.filter(item => item.ok).length;
      const fail =
        logs.length - ok;
      const durations =
        logs
          .map(item =>
            Number(
              item.diagnostics?.durationMs
            )
          )
          .filter(Number.isFinite);
      const avg =
        durations.length
          ? Math.round(
              durations.reduce(
                (a,b) => a + b,
                0
              ) / durations.length
            )
          : 0;

      summaryEl.innerHTML = [
        `<span class="pill">전체 ${logs.length}</span>`,
        `<span class="pill">성공 ${ok}</span>`,
        `<span class="pill">실패 ${fail}</span>`,
        `<span class="pill">평균 ${avg ? avg + "ms" : "-"}</span>`
      ].join("");

      if (!logs.length) {
        logsEl.innerHTML =
          '<div class="empty">아직 Gemini 요청 로그가 없습니다.</div>';
        return;
      }

      logsEl.innerHTML =
        logs.map(item => {
          const d =
            item.diagnostics || {};
          const u =
            item.usage || {};
          const nodes =
            Array.isArray(item.nodeTypes)
              ? item.nodeTypes.join(" · ")
              : "";

          return `
            <article class="${item.ok ? "" : "fail"}">
              <div class="top">
                <span class="state"></span>
                <span class="kind">${esc(item.kind)}</span>
                <span class="nodes">${esc(nodes || item.code || "")}</span>
                <time>${esc(new Date(item.at).toLocaleTimeString())}</time>
              </div>
              <div class="metrics">
                ${metric("duration", Number.isFinite(Number(d.durationMs)) ? Number(d.durationMs) + "ms" : null)}
                ${metric("model", item.model)}
                ${metric("thinking", d.thinkingLevel)}
                ${metric("attempt", d.primaryAttempts)}
                ${metric("retry", d.transientRetries)}
                ${metric("repair", d.repairAttempts)}
                ${metric("tokens", u.totalTokens)}
                ${metric("status", item.status)}
              </div>
              ${item.preview ? `<div class="preview">${esc(item.preview)}</div>` : ""}
            </article>
          `;
        }).join("");
    }

    async function refresh(){
      try {
        const response =
          await fetch(
            "/api/logs",
            {cache:"no-store"}
          );
        const data =
          await response.json();

        if (
          response.ok &&
          data?.ok
        ) {
          renderRuntime(
            data.runtime || null
          );

          render(
            Array.isArray(data.logs)
              ? data.logs
              : []
          );
        }
      } catch {}
    }

    refresh();
    setInterval(refresh,3000);
  </script>
</body>
</html>
