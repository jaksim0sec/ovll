<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual"
  >

  <meta
    name="theme-color"
    content="#101010"
  >
  <meta name="color-scheme" content="light dark">

  <script>
    (() => {
      const root =
        document.documentElement;

      let theme = "dark";

      try {
        const saved =
          localStorage.getItem(
            "ovll:theme"
          );

        if (
          saved === "light" ||
          saved === "dark"
        ) {
          theme = saved;
        }
      } catch {}

      const dark =
        theme === "dark";

      root.classList.toggle(
        "dark",
        dark
      );
      root.classList.add(
        "ovll-booting"
      );
      root.dataset.theme =
        theme;
      root.style.colorScheme =
        theme;

      const meta =
        document.querySelector(
          'meta[name="theme-color"]'
        );

      if (meta) {
        meta.content =
          dark
            ? "#101010"
            : "#f3f3f2";
      }
    })();
  </script>

  <style>
    html {
      background: #f3f3f2;
    }

    :root.dark {
      background: #101010;
    }

    body {
      background: inherit;
    }

    html.ovll-booting #app {
      visibility: hidden;
    }

    #boot-screen {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #f3f3f2;
      color: #171717;
      opacity: 1;
      transition:
        opacity .22s cubic-bezier(.2,.82,.2,1),
        visibility .22s ease;
    }

    :root.dark #boot-screen {
      background: #101010;
      color: #f5f5f5;
    }

    #boot-screen.is-ready {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .ovll-boot-mark {
      width: min(18rem, calc(100vw - 3rem));
      display: grid;
      justify-items: center;
      gap: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      transform: translateY(-.35rem);
      animation:
        ovll-boot-mark-in
        .36s
        cubic-bezier(.2,.82,.2,1)
        both;
    }

    .ovll-boot-orb {
      --boot-orb: #202120;
      --boot-eye: #efefec;
      width: 3.1rem;
      height: 3.1rem;
      display: grid;
      place-items: center;
      border: .0625rem solid var(--boot-orb);
      border-radius: 50%;
      background: var(--boot-orb);
      box-shadow:
        0 .12rem .42rem rgba(0, 0, 0, .105);
      animation:
        ovll-boot-orb
        2.8s
        cubic-bezier(.45,0,.25,1)
        infinite;
    }

    :root.dark .ovll-boot-orb {
      --boot-orb: #dededb;
      --boot-eye: #151617;
      box-shadow:
        0 .12rem .48rem rgba(0, 0, 0, .22);
    }

    .ovll-boot-eye {
      width: .62rem;
      height: .64rem;
      border-radius: .23rem;
      background: var(--boot-eye);
      transform: translateY(-.01rem);
      animation:
        ovll-boot-eye
        3.4s
        cubic-bezier(.2,.82,.2,1)
        infinite;
    }

    .ovll-boot-wordmark {
      margin-top: .8rem;
      font-size: 1.14rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -.045em;
    }

    .ovll-boot-progress {
      width: 3.6rem;
      height: .1rem;
      margin-top: .82rem;
      overflow: hidden;
      border-radius: 999px;
      background: currentColor;
      opacity: .12;
    }

    .ovll-boot-progress::after {
      content: "";
      display: block;
      width: 38%;
      height: 100%;
      border-radius: inherit;
      background: currentColor;
      opacity: 1;
      animation:
        ovll-boot-slide
        1.18s
        cubic-bezier(.45,0,.25,1)
        infinite;
    }

    .ovll-boot-error {
      display: none;
      max-width: 15rem;
      margin-top: .72rem;
      text-align: center;
      font-size: .72rem;
      font-weight: 500;
      line-height: 1.55;
      opacity: .62;
    }

    .ovll-boot-retry {
      display: none;
      min-height: 2rem;
      margin-top: .72rem;
      padding: 0 .8rem;
      border: .0625rem solid rgba(0, 0, 0, .08);
      border-radius: 999px;
      background: rgba(255, 255, 255, .62);
      color: inherit;
      font: inherit;
      font-size: .68rem;
      font-weight: 620;
      cursor: pointer;
      box-shadow:
        0 .12rem .48rem rgba(0, 0, 0, .045);
    }

    :root.dark .ovll-boot-retry {
      border-color: rgba(255, 255, 255, .09);
      background: rgba(255, 255, 255, .055);
      box-shadow:
        0 .12rem .48rem rgba(0, 0, 0, .18);
    }

    #boot-screen.is-error
    .ovll-boot-orb {
      animation: none;
      opacity: .82;
    }

    #boot-screen.is-error
    .ovll-boot-eye {
      height: .1rem;
      border-radius: 999px;
      animation: none;
    }

    #boot-screen.is-error
    .ovll-boot-progress {
      display: none;
    }

    #boot-screen.is-error
    .ovll-boot-error,
    #boot-screen.is-error
    .ovll-boot-retry {
      display: block;
    }

    @keyframes ovll-boot-mark-in {
      from {
        opacity: 0;
        transform:
          translateY(.15rem)
          scale(.965);
      }

      to {
        opacity: 1;
        transform:
          translateY(-.35rem)
          scale(1);
      }
    }

    @keyframes ovll-boot-slide {
      from {
        transform: translateX(-118%);
      }

      to {
        transform: translateX(256%);
      }
    }

    @keyframes ovll-boot-orb {
      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-.055rem) scale(.985, 1.015);
      }
    }

    @keyframes ovll-boot-eye {
      0%,
      42%,
      47%,
      100% {
        transform: translateY(-.01rem) scaleY(1);
      }

      44% {
        transform: translateY(-.01rem) scaleY(.12);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ovll-boot-mark,
      .ovll-boot-orb,
      .ovll-boot-eye,
      .ovll-boot-progress::after {
        animation: none;
      }

      .ovll-boot-progress::after {
        width: 100%;
      }

      #boot-screen {
        transition: none;
      }
    }
  </style>
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ovll">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/pwa-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/pwa-192.png">

  <title>ovll</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css"
  >

  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/ui.css">
  <link rel="stylesheet" href="./css/node.css">
  <link rel="stylesheet" href="./css/chat.css">
  <link rel="stylesheet" href="./css/library.css">
  <link rel="stylesheet" href="./css/shellMenu.css">
</head>

<body>

  <div
    id="boot-screen"
    role="status"
    aria-live="polite"
    aria-label="오블 불러오는 중"
  >
    <div class="ovll-boot-mark">
      <div class="ovll-boot-orb" aria-hidden="true">
        <span class="ovll-boot-eye"></span>
      </div>
      <div class="ovll-boot-wordmark">ovll</div>
      <div class="ovll-boot-progress" aria-hidden="true"></div>
      <div class="ovll-boot-error">
        오블을 불러오지 못했습니다<br>
        다시 시도해 주세요
      </div>
      <button
        id="boot-retry"
        class="ovll-boot-retry"
        type="button"
      >다시 시도</button>
    </div>
  </div>

  <div id="app">
    <div id="app-stage">

    <div id="workspace-shell" class="ovll-workspace-shell">

    <!-- Fixed UI -->
    <header id="topbar">
      <div
        id="mode-switch"
        role="tablist"
        aria-label="화면 모드"
      >
        <button
          id="mode-chat"
          type="button"
          role="tab"
          aria-selected="true"
          data-mode="chat"
        >
          채팅
        </button>

        <button
          id="mode-canvas"
          type="button"
          role="tab"
          aria-selected="false"
          data-mode="canvas"
        >
          캔버스
        </button>

      </div>

    </header>


    <!-- Main workspace -->
    <main id="workspace">

      <!-- Chat page -->
      <section
        id="chat-page"
        class="page"
        data-page="chat"
        aria-label="채팅"
      >
        <div id="chat-content">
          <div id="chat-messages"></div>
        </div>
      </section>


      <!-- Canvas page -->
      <section
        id="canvas-page"
        class="page"
        data-page="canvas"
        aria-label="캔버스"
      >
        <div id="canvas-viewport">
          <div id="canvas-world">
            <svg
              id="canvas-connections"
              aria-hidden="true"
            ></svg>

            <div id="canvas-nodes"></div>
          </div>
        </div>
      </section>


    </main>


    <!-- Fixed composer -->
    <footer id="composer">
      <form id="composer-form">

        <input
          id="composer-file-input"
          type="file"
          hidden
        />

        <button
          id="composer-attach"
          type="button"
          aria-label="파일 추가"
          title="파일 추가"
        >
          <svg viewBox="0 0 20 20" fill="none" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <path d="M10 5v10M5 10h10"></path>
          </svg>
        </button>

        <textarea
          id="composer-input"
          name="message"
          rows="1"
          autocomplete="off"
          autocapitalize="sentences"
          spellcheck="true"
          placeholder="무엇을 할까요?"
        ></textarea>

        <button
          id="composer-submit"
          type="submit"
          aria-label="전송"
        ></button>

      </form>
    </footer>

    </div>
    <!-- /workspace-shell -->

    <!-- Standalone library -->
    <section
      id="library-page"
      class="ovll-library-page"
      aria-label="라이브러리"
      hidden
    >
      <div class="ovll-library-shell">
        <header class="ovll-library-header">
          <div class="ovll-library-title-row">
            <div class="ovll-library-heading">
              <h1>라이브러리</h1>
            </div>
          </div>

          <label class="ovll-library-search">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="8.7" cy="8.7" r="4.7"></circle>
              <path d="m12.3 12.3 3.3 3.3"></path>
            </svg>
            <input
              type="search"
              data-library-search-input
              placeholder="파일 검색"
              autocomplete="off"
              spellcheck="false"
              aria-label="라이브러리 검색"
            >
          </label>
        </header>

        <div
          class="ovll-library-content"
          data-library-content
        >
          <div class="ovll-library-browser">
            <div
              class="ovll-library-grid"
              data-library-grid
            ></div>
          </div>
        </div>
      </div>
    </section>


    </div>
  </div>


  <!-- Runtime config + version guard + application bootstrap -->
  <script src="./runtime-config.js"></script>
  <script src="./js/boot.js"></script>

</body>
</html>
